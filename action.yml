name: Power Platform release checks
description: Block an unpacked Power Platform solution with an unapproved connector, no owner or an overdue review.
inputs:
  solution:
    description: Folder produced by pac solution unpack
    required: true
  manifest:
    description: Governance manifest (YAML)
    default: governance.yml
  rules:
    description: Rules file (YAML)
    default: rules.yml
  format:
    description: text, json or github (annotations)
    default: github
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pprc
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Run pprc check
      shell: bash
      run: pprc check "${{ inputs.solution }}" --manifest "${{ inputs.manifest }}" --rules "${{ inputs.rules }}" --format "${{ inputs.format }}"
