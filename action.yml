name: Automation release checks
description: Block an n8n or Apps Script automation that uses an unapproved service, has no owner, an overdue review, or a hardcoded secret or email address.
inputs:
  paths:
    description: One or more automation folders, separated by spaces (globs allowed)
    required: true
  manifest:
    description: Governance manifest (YAML)
    default: governance.yml
  rules:
    description: Rules file (YAML)
    default: rules.yml
  format:
    description: text, json or github (annotations)
    default: github
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install arc
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Run arc check
      shell: bash
      run: arc check ${{ inputs.paths }} --manifest "${{ inputs.manifest }}" --rules "${{ inputs.rules }}" --format "${{ inputs.format }}"
