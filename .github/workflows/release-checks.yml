name: Release checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  live-automations:
    name: Check automations/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          paths: automations/*
  samples:
    name: Check the sample sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compliant set must pass
        uses: ./
        with:
          paths: samples/compliant/automations/*
          manifest: samples/compliant/governance.yml
      - name: Noncompliant set must fail
        id: bad
        continue-on-error: true
        uses: ./
        with:
          paths: samples/noncompliant/automations/*
          manifest: samples/noncompliant/governance.yml
          format: text
      - name: Malformed set must fail
        id: malformed
        continue-on-error: true
        uses: ./
        with:
          paths: samples/malformed/automations/*
          manifest: samples/malformed/governance.yml
          format: text
      - name: Confirm the two bad sets were rejected
        if: ${{ steps.bad.outcome != 'failure' || steps.malformed.outcome != 'failure' }}
        run: echo "A bad sample set was not rejected" && exit 1
