[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-release-checks"
version = "0.2.0"
description = "Release checks for n8n workflows and Google Apps Script projects"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
